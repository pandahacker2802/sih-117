version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: sih-117-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: sih26-117
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - sih-117-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih-117-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/sih26-117?authSource=admin
      MONGODB_DB_NAME: sih26-117
      JWT_SECRET: your-secret-jwt-key-change-in-production
      JWT_EXPIRY: 7d
      BCRYPT_ROUNDS: 12
      OLLAMA_URL: http://ollama:11434/api
      OLLAMA_MODEL: gemma:2b
      CORS_ORIGIN: http://localhost:5173
      MAX_FILE_SIZE: 52428800
      UPLOAD_DIR: /app/uploads
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
      - backend_node_modules:/app/node_modules
    networks:
      - sih-117-network
    healthcheck:
      test: curl --fail http://localhost:5000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # AI Agent Service
  ai-agent:
    build:
      context: ./AI\ Agent
      dockerfile: Dockerfile
    container_name: sih-117-ai-agent
    environment:
      NODE_ENV: development
      PORT: 3001
      BACKEND_URL: http://backend:5000/api
      OLLAMA_URL: http://ollama:11434/api
      RAG_URL: http://backend:5000/api/rag
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./AI\ Agent/src:/app/src
      - ai_agent_node_modules:/app/node_modules
    networks:
      - sih-117-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend/sovara-ai
      dockerfile: Dockerfile
    container_name: sih-117-frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_AI_AGENT_URL: http://localhost:3001/api
      VITE_APP_NAME: SOVARA AI
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/sovara-ai/src:/app/src
      - frontend_node_modules:/app/node_modules
    networks:
      - sih-117-network
    restart: unless-stopped

  # Ollama LLM Service (Optional but Recommended)
  ollama:
    image: ollama/ollama:latest
    container_name: sih-117-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NUM_THREAD: 4
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - sih-117-network
    restart: unless-stopped
    # Note: Run this after starting to pull the model:
    # docker exec sih-117-ollama ollama pull gemma:2b

  # Optional: MongoDB Express (Web UI for MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: sih-117-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - sih-117-network
    restart: unless-stopped

networks:
  sih-117-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  backend_node_modules:
  ai_agent_node_modules:
  frontend_node_modules:
  ollama_models:
